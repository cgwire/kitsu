---
name: Kitsu CI

on: [push, pull_request]

env:
  NODE_OPTIONS: --max_old_space_size=8192
  HUSKY: 0

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, current]
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install npm dependencies
        run: |
          echo "Node.js $(node -v)"
          echo "npm v$(npm -v)"
          npm ci
      # Restored after npm ci, which wipes node_modules. Holds the Vitest
      # dependency prebundle; the npm cache above only covers downloads.
      - name: Cache the Vite prebundle
        uses: actions/cache@v6
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('package-lock.json', 'vite.config.js') }}
      - name: Run tests
        run: npm run test:unit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: current
          cache: npm
      - name: Install npm dependencies
        run: |
          echo "Node.js $(node -v)"
          echo "npm v$(npm -v)"
          npm ci
      - name: Run linter
        env:
          NODE_ENV: production
        run: npm run lint -- --quiet

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: current
          cache: npm
      - name: Install npm dependencies
        run: |
          echo "Node.js $(node -v)"
          echo "npm v$(npm -v)"
          npm ci
      - name: Build application
        run: npm run build
