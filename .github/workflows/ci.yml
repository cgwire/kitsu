---
name: Kitsu CI

on: [push, pull_request]

# A new push to the same branch makes the run in flight pointless: stop it
# instead of paying for it to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max_old_space_size=8192
  HUSKY: 0

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    env:
      # Vitest transform cache version (see its cache step). Change it to a
      # value no other branch would pick, such as the date and the moved
      # module: two branches changing it at the same time then conflict here.
      VITEST_CACHE_VERSION: 2026-09-17
    strategy:
      matrix:
        node: [22, 24, current]
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install npm dependencies
        run: |
          echo "Node.js $(node -v)"
          echo "npm v$(npm -v)"
          npm ci
      # Restored after npm ci, which wipes node_modules. Holds the Vitest
      # dependency prebundle; the npm cache above only covers downloads.
      - name: Cache the Vite prebundle
        uses: actions/cache@v6
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('package-lock.json', 'vite.config.js') }}
      # Vitest transform cache: each passing run saves its own copy and restores
      # the latest one saved on its ref, then on the base branch. Entries
      # ignore how imports resolve (see vite.config.js): with a change to the
      # file an unchanged extensionless import resolves to, and again with its
      # revert, change VITEST_CACHE_VERSION, or restored entries keep the old
      # paths. To clear a branch already red without a commit:
      # gh cache list --key vitest- --json id --jq '.[].id' | xargs -n1 gh cache delete
      - name: Cache the Vitest transforms
        uses: actions/cache@v6
        with:
          path: node_modules/.vitest-cache
          key: vitest-${{ env.VITEST_CACHE_VERSION }}-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('package-lock.json', 'vite.config.js') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ env.VITEST_CACHE_VERSION }}-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('package-lock.json', 'vite.config.js') }}-
      - name: Run tests
        run: npm run test:unit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: current
          cache: npm
      - name: Install npm dependencies
        run: |
          echo "Node.js $(node -v)"
          echo "npm v$(npm -v)"
          npm ci
      - name: Run linter
        env:
          NODE_ENV: production
        run: npm run lint -- --quiet

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: current
          cache: npm
      - name: Install npm dependencies
        run: |
          echo "Node.js $(node -v)"
          echo "npm v$(npm -v)"
          npm ci
      - name: Build application
        run: npm run build
