<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kitsu - Collaboration Platform For Animation And VFX Studios</title>
    <link rel="preload" href="/api/config" as="fetch" crossorigin />
    <link rel="icon" href="/favicon.ico" />
    <style>
      .dark-boot,
      .dark-boot body {
        background: #36393f;
      }
    </style>
    <script>
      // Paints the dark theme while the app loads, with the rule App.vue
      // starts with: the user's choice, else the studio default the last
      // config left, and always dark on shared playlists.
      try {
        const choice = localStorage.getItem('dark-theme')
        if (
          location.pathname.startsWith('/playlists/shared/') ||
          choice === 'true' ||
          (choice !== 'false' &&
            localStorage.getItem('dark-theme-default') === 'true')
        ) {
          document.documentElement.classList.add('dark-boot')
        }
      } catch {}
    </script>
  </head>
  <body>
    <noscript>
      <strong>
        We're sorry but Kitsu doesn't work properly without JavaScript enabled.
        Please enable it to continue.
      </strong>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
